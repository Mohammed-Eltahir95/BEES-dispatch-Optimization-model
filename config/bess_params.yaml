# Battery physical & economic parameters
# (overridden by Excel 'battery_params' sheet if input_source includes excel)

battery:
  energy_capacity_mwh: 10.0
  power_limit_mw: 5.0
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  soc_min_pct: 0.10
  soc_max_pct: 0.95
  soc_initial_pct: 0.50
  soc_final_pct: 0.50          # optional terminal SOC constraint

degradation:
  model_type: "linearized_cycle_calendar"   # keeps problem LP-compatible for HiGHS
  cost_per_mwh_throughput: 4.5     # $/MWh cycled, blended cycle-aging proxy
  calendar_fade_per_day_pct: 0.005
  capital_cost_per_kwh: 250
  end_of_life_capacity_pct: 0.80
  cycle_life_curve_file: "data/degradation/cycle_life_curve.csv"

degradation_constraints:
  max_daily_throughput_mwh: 20.0
  max_cycles_per_day: 1.5
